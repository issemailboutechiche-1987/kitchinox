    - web/objects/polyhaven/alarm_clock_01/
    - web/objects/polyhaven/alarm_clock_01/textures/
    - web/objects/polyhaven/thumbs/
    - web/vendor/
    - web/vendor/environments/
    - web/vendor/loaders/
    - web/vendor/utils/

  # police Plus Jakarta Sans intégrée (licence OFL, assets/fonts/OFL.txt) : rien n'est téléchargé au lancement
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-latin-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-latin-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-latin-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-latin-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-latin-800.ttf
          weight: 800
    # même police sous le nom par défaut du moteur web : les dessins (plans, cotes) l'utilisent aussi
    # et rien n'est demandé aux serveurs de Google
    - family: Roboto
      fonts:
        - asset: assets/fonts/PlusJakartaSans-latin-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-latin-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-latin-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-latin-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-latin-800.ttf
          weight: 800
    - family: JakartaExt
      fonts:
        - asset: assets/fonts/PlusJakartaSans-latin-ext-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-latin-ext-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-latin-ext-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-latin-ext-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-latin-ext-800.ttf
          weight: 800

