name: kitchen_planner
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  web: ^1.1.1
  pdf: ^3.13.1
  webview_flutter: ^4.14.1
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  archive: ^4.0.0
  printing: 5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/logo.svg
    - assets/data/
    - assets/data/furniture/
    # PDF en arabe : Noto Sans Arabic (licence OFL, OFL.txt dans le dossier)
    - assets/fonts/noto_arabic/
    # app native (iPad) : moteur 3D three.js et modeles servis a la vue 3D par l'app elle-meme
    - web/three_view.js
    - web/hd_render.js
    - assets/web3d/
    - web/objects/kenney/
    - web/objects/kenney/thumbs/
    - web/objects/polyhaven/
    - web/objects/polyhaven/ArmChair_01/
    - web/objects/polyhaven/ArmChair_01/textures/
    - web/objects/polyhaven/Ottoman_01/
    - web/objects/polyhaven/Ottoman_01/textures/
    - web/objects/polyhaven/Sofa_01/
    - web/objects/polyhaven/Sofa_01/textures/
    - web/objects/polyhaven/bar_chair_round_01/
    - web/objects/polyhaven/bar_chair_round_01/textures/
    - web/objects/polyhaven/ceramic_vase_01/
    - web/objects/polyhaven/ceramic_vase_01/textures/
    - web/objects/polyhaven/coffee_table_round_01/
    - web/objects/polyhaven/coffee_table_round_01/textures/
    - web/objects/polyhaven/dining_chair_02/
    - web/objects/polyhaven/dining_chair_02/textures/
    - web/objects/polyhaven/gallinera_chair/
    - web/objects/polyhaven/gallinera_chair/textures/
    - web/objects/polyhaven/gallinera_table/
    - web/objects/polyhaven/gallinera_table/textures/
    - web/objects/polyhaven/mid_century_lounge_chair/
    - web/objects/polyhaven/mid_century_lounge_chair/textures/
    - web/objects/polyhaven/modern_arm_chair_01/
    - web/objects/polyhaven/modern_arm_chair_01/textures/
    - web/objects/polyhaven/modern_ceiling_lamp_01/
    - web/objects/polyhaven/modern_ceiling_lamp_01/textures/
    - web/objects/polyhaven/modern_coffee_table_01/
    - web/objects/polyhaven/modern_coffee_table_01/textures/
    - web/objects/polyhaven/modern_coffee_table_02/
    - web/objects/polyhaven/modern_coffee_table_02/textures/
    - web/objects/polyhaven/modern_wooden_cabinet/
    - web/objects/polyhaven/modern_wooden_cabinet/textures/
    - web/objects/polyhaven/potted_plant_02/
    - web/objects/polyhaven/potted_plant_02/textures/
    - web/objects/polyhaven/potted_plant_04/
    - web/objects/polyhaven/potted_plant_04/textures/
    - web/objects/polyhaven/round_wooden_table_01/
    - web/objects/polyhaven/round_wooden_table_01/textures/
    - web/objects/polyhaven/side_table_01/
    - web/objects/polyhaven/side_table_01/textures/
    - web/objects/polyhaven/side_table_tall_01/
    - web/objects/polyhaven/side_table_tall_01/textures/
    - web/objects/polyhaven/sofa_02/
    - web/objects/polyhaven/sofa_02/textures/
    - web/objects/polyhaven/sofa_03/
    - web/objects/polyhaven/sofa_03/textures/
    - web/objects/polyhaven/throw_pillows_01/
    - web/objects/polyhaven/throw_pillows_01/textures/
